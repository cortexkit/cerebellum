[workspace]
resolver = "2"
members = [
    "crates/cerebellum",
    "crates/cerebellum-core",
    "crates/cerebellum-computer",
    "crates/cerebellum-macos",
]

# ck-cerebellum — the browser/computer-use motor-execution organ for the
# CortexKit fleet. Spec A (this slice) stands up the subc wire seam: wire-v2
# registration with spawn attestation, insulated health-v2, three-fact bind
# identity, profile-boundary disposition, principal default-deny, and one
# no-op capability (`browser.status`). No browser, no CDP, no profile storage
# — those are Spec B.
#
# The subc wire contract crates are PATH dependencies on the sibling
# subconscious monorepo (same arrangement AFT and ck-quota use):
# subc-protocol/subc-transport are the module-facing wire; subc-core is a
# dev-only dep for the in-process daemon used in end-to-end conformance tests.
[workspace.dependencies]
# The subc wire contract crates are PATH dependencies on the sibling subconscious
# monorepo (same arrangement AFT and ck-quota use). The paths are RELATIVE, so
# the workspace builds from any checkout that has the sibling beside it rather
# than only on one developer's machine. A detached worktree lives outside this
# repo's parent directory, and the sibling is placed beside it there when the
# worktree is created; CI checks the sibling out next to this repo for the same
# reason.
subc-protocol = { path = "../subconscious/crates/subc-protocol" }
subc-transport = { path = "../subconscious/crates/subc-transport" }
subc-control = { path = "../subconscious/crates/subc-control" }
subc-core = { path = "../subconscious/crates/subc-core" }
subc-jsonc = { path = "../subconscious/crates/subc-jsonc" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }