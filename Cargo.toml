[workspace]
resolver = "2"
members = [
    "crates/cerebellum",
    "crates/cerebellum-bridge-protocol",
    "crates/cerebellum-core",
    "crates/cerebellum-computer",
    "crates/cerebellum-linux",
    "crates/cerebellum-macos",
    "crates/cerebellum-native-host",
    "crates/cerebellum-windows",
]

# ck-cerebellum — the browser/computer-use motor-execution organ for the
# CortexKit fleet. Spec A (this slice) stands up the subc wire seam: wire-v2
# registration with spawn attestation, insulated health-v2, three-fact bind
# identity, profile-boundary disposition, principal default-deny, and one
# no-op capability (`browser.status`). No browser, no CDP, no profile storage
# — those are Spec B.
#
# Fleet crates are exact registry releases; unpublished crates use a full git
# revision. Cargo.lock records their checksums or commits, with no sibling layout.
[workspace.dependencies]
subc-protocol = "=0.34.2"
subc-transport = "=0.15.0"
subc-os = "=0.1.26"
# Test-only in-process daemon and client control types.
subc-control = "=0.34.0"
subc-daemon = "=0.39.0"
subc-jsonc = "=0.1.2"
cortexkit-store-types = "=0.2.2"
cortexkit-resource-busy = { git = "https://github.com/cortexkit/commons", rev = "067701f1ab61cd2c81aa58fb66b0cb65fbaef9e7" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
# Only `low_level::emulate_default_handler`, which re-raises SIGTERM with the
# default disposition restored so a supervisor sees a death by signal. The
# default features add a signal-iterator thread this module does not use.
signal-hook = { version = "0.4", default-features = false }

# Test fixtures hash executable bytes; keep hashing fast in dev and inherited test builds.
[profile.dev.package.sha2]
opt-level = 3
