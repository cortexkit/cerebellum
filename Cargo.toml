[workspace]
resolver = "2"
members = [
    "crates/cerebellum",
    "crates/cerebellum-core",
    "crates/cerebellum-computer",
    "crates/cerebellum-linux",
    "crates/cerebellum-macos",
    "crates/cerebellum-windows",
]

# ck-cerebellum — the browser/computer-use motor-execution organ for the
# CortexKit fleet. Spec A (this slice) stands up the subc wire seam: wire-v2
# registration with spawn attestation, insulated health-v2, three-fact bind
# identity, profile-boundary disposition, principal default-deny, and one
# no-op capability (`browser.status`). No browser, no CDP, no profile storage
# — those are Spec B.
#
# The subc wire contract crates (subc-protocol, subc-transport, subc-jsonc) are
# PATH dependencies on the sibling subconscious monorepo, pinned by subtree in
# subconscious-source.txt. The test harness's daemon and client control crates
# come from crates.io instead; see the patch section at the end of this file.
[workspace.dependencies]
# The subc wire contract crates are PATH dependencies on the sibling subconscious
# monorepo (same arrangement AFT and ck-quota use). The paths are RELATIVE, so
# the workspace builds from any checkout that has the sibling beside it rather
# than only on one developer's machine. A detached worktree lives outside this
# repo's parent directory, and the sibling is placed beside it there when the
# worktree is created; CI checks the sibling out next to this repo for the same
# reason.
subc-protocol = { path = "../subconscious/crates/subc-protocol" }
subc-transport = { path = "../subconscious/crates/subc-transport" }
# Test-only: the in-process daemon the live tests boot, and the client control
# types they speak to it. Taken from crates.io at a fixed version so the lock
# moves on them only when this repo chooses, not whenever the sibling does.
subc-control = "0.23.0"
subc-daemon = "0.24.0"
subc-jsonc = { path = "../subconscious/crates/subc-jsonc" }
# The fleet commons, a second sibling beside subconscious, for the daemon-
# aligned home resolvers (`resolve_data_home` / `resolve_config_home`). One
# callable each, so this module CALLS the ladder the daemon publishes rather
# than carrying a copy that drifts. Pinned by subtree in commons-source.txt
# the same way the subconscious crates are.
cortexkit-store-types = { path = "../commons/crates/cortexkit-store-types" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
# Only `low_level::emulate_default_handler`, which re-raises SIGTERM with the
# default disposition restored so a supervisor sees a death by signal. The
# default features add a signal-iterator thread this module does not use.
signal-hook = { version = "0.4", default-features = false }

# The test harness takes subc-daemon and subc-control from crates.io, so the
# lock moves on the daemon only when this repo chooses. Those published crates
# depend on the wire crates by version, and the test code hands wire types
# between them and this module, so the wire crates must be ONE copy: this
# patch points the registry's wire crates at the same sibling path the module
# builds against. Without it cargo links two subc-protocols and every type
# crossing between them fails to match.
[patch.crates-io]
subc-protocol = { path = "../subconscious/crates/subc-protocol" }
subc-transport = { path = "../subconscious/crates/subc-transport" }
subc-jsonc = { path = "../subconscious/crates/subc-jsonc" }
