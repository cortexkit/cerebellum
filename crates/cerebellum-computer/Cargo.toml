[package]
name = "cerebellum-computer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The macOS computer-plane platform surface for ck-cerebellum."

[lib]
name = "cerebellum_computer"
path = "src/lib.rs"

[features]
test-support = ["cerebellum-macos/test-support"]

[dependencies]
base64 = "0.22"
cerebellum-core = { path = "../cerebellum-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

# The framework readings live in their own crate so this one can keep
# #![forbid(unsafe_code)], which cannot be overridden from inside a crate and so
# holds for every module here without anyone enforcing it. Needed only where
# those frameworks exist; every other host builds this crate without it and
# keeps the typed refusals the platform-neutral modules already return.
[target.'cfg(target_os = "macos")'.dependencies]
cerebellum-macos = { path = "../cerebellum-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
cerebellum-windows = { path = "../cerebellum-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
cerebellum-linux = { path = "../cerebellum-linux" }

# Tests read back the events the macOS driver would post, which needs the
# framework event type the seam crate wraps. Dev-only and macOS-only, pinned
# to the same version the seam uses: production code keeps its single
# framework path through cerebellum-macos.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = "=0.3.2"
cerebellum-macos = { path = "../cerebellum-macos", features = ["test-support"] }
