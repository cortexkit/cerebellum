[package]
name = "cerebellum"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The ck-cerebellum subc module: Spec A — wire-v2 registration, insulated health-v2, three-fact identity, profile-boundary disposition, principal default-deny, and the browser.status capability."

[features]
default = []
# Enables the in-memory identity-resolution observer for conformance tests only.
# Production builds leave this feature disabled, so no observer code is emitted.
# Forwards to the substrate crate, which owns the observer now that identity
# lives in cerebellum-core.
test-observer = ["cerebellum-core/test-observer"]
# Stock Chrome for Testing has an ad-hoc loader signature, not Google's
# Developer ID. This weaker pin is for operator-approved browser tests only;
# cerebellum-macos rejects the feature in signing-attested release builds.
chrome-for-testing-parent-probe = ["cerebellum-macos/chrome-for-testing-parent-probe"]

[[bin]]
name = "ck-cerebellum"
path = "src/main.rs"

# Built by cargo test for embedded daemon supervisors; release builds select
# only ck-cerebellum and staging never copies this test helper.
[[bin]]
name = "cerebellum-test-privacy-trampoline"
path = "tests/support/privacy_trampoline.rs"
test = false
bench = false

[[bin]]
name = "cerebellum-test-nonce-holder"
path = "tests/support/nonce_holder.rs"
test = false
bench = false

[lib]
name = "cerebellum"
path = "src/lib.rs"

[dependencies]
cortexkit-resource-busy = { workspace = true }
cerebellum-bridge-protocol = { path = "../cerebellum-bridge-protocol" }
cortexkit-paths = "=0.1.2"
cerebellum-core = { path = "../cerebellum-core" }
cerebellum-computer = { path = "../cerebellum-computer" }
subc-protocol = { workspace = true }
subc-control = { workspace = true }
subc-transport = { workspace = true }
subc-jsonc = { workspace = true }
subc-os = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
# The tool-provider/v1 contract supplies catalog, pin and late-result types.
# The conformance companion shares the production protocol version so catalog,
# schema-pin and late-result checks use the same wire types.
cortexkit-role-tool-provider = "=0.9.2"
getrandom = "=0.2.17"
tokio = { workspace = true }
tokio-util = { workspace = true }

# SIGTERM runs the same bounded teardown EOF does and then re-raises itself.
# Unix only: Windows has no SIGTERM, and keeps ending on EOF alone.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }
signal-hook = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
cerebellum-macos = { path = "../cerebellum-macos" }
avatar-svg = { git = "ssh://git@github.com/cortexkit/avatar.git", rev = "b9696127a4095e76b5ace3503aab877d449702f0" }
resvg = "0.44"

[target.'cfg(target_os = "linux")'.dependencies]
cerebellum-linux = { path = "../cerebellum-linux" }

[dev-dependencies]
async-trait = "0.1"
cortexkit-role-tool-provider-conformance = "=0.9.2"
tokio = { workspace = true, features = ["test-util"] }
# The in-process daemon the live tests boot moved out of subc-core when the
# publishable daemon package was split off; the harness follows the code.
subc-daemon = { workspace = true }
# The in-process daemon the live tests boot emits tracing events and installs
# no subscriber of its own; without one here, every daemon-side line is
# discarded before it exists. Both crates are already in the graph via subc-daemon.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
cortexkit-test-support = "=0.1.10"

# Examples carry their own tests, and cargo defaults an example target to
# test = false -- so `cargo test --workspace` builds them and skips their
# #[cfg(test)] modules. iceteaSA found the workspace count unmoved by five
# tests that passed whenever anyone ran them directly. Tests that are neither
# broken nor unwritten, merely invisible to the only command anyone runs, are
# worse than missing ones: the count going up reads as coverage.
[[example]]
name = "live_native_click"
test = true

[[example]]
name = "live_native_menu"
test = true

[[example]]
name = "live_launch"
test = true

[[example]]
name = "live_login"
test = true

[[example]]
name = "live_interrupt"
test = true

[[example]]
name = "crashpad_census"
test = true

[[example]]
name = "live_ax_actions"
test = true

[[example]]
name = "live_discord_task"
test = true

[[example]]
name = "v13_desk_arms"
test = true

[[example]]
name = "stuck_app_desk_probe"
test = true
