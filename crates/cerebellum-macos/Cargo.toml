[package]
name = "cerebellum-macos"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Raw macOS framework readings for ck-cerebellum. One of two seam crates in the workspace permitted to contain unsafe code."

[features]
default = []
# Exposes permission-skip helpers only when a dependent test target opts in.
test-support = []
# Acceptance probes only. release-build.sh binds the signing-topology revision,
# which makes compilation reject this weaker parent identity in shipped builds.
chrome-for-testing-parent-probe = []

[lib]
name = "cerebellum_macos"
path = "src/lib.rs"

# No standard harness: this test opens an AppKit window, which must happen on a
# process's main thread, and the harness runs every test on a thread of its own.
# Its own `main` stands in for the harness and prints ok, SKIPPED, or FAILED.
[[test]]
name = "source_rect_pattern"
path = "tests/source_rect_pattern.rs"
harness = false

# Cargo defaults an example target to test = false, which builds the example's
# #[cfg(test)] module but never runs it. This probe's pure decision rules carry
# host-neutral tests, so the target must opt in to running them.
[[example]]
name = "background_keys_matrix"
path = "examples/background_keys_matrix.rs"
test = true

# Framework bindings are needed only where the frameworks exist. On every other
# host this crate compiles to nothing, so the workspace still builds and tests
# there without them.
#
# Pinned exactly: these crates are pre-1.0 and break across minor versions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "=0.3.2"
objc2-screen-capture-kit = "=0.3.2"
objc2-foundation = "=0.3.2"
block2 = "=0.6.2"
objc2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSPanel", "NSScreen", "NSColor", "NSTextField", "NSControl", "NSView", "NSWorkspace", "NSEvent", "NSResponder", "NSBezierPath", "NSGraphics", "NSFont", "NSAccessibility", "NSRunningApplication", "NSWindowRestoration", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSShadow", "NSGraphicsContext", "NSParagraphStyle", "NSFontDescriptor", "NSText", "objc2-core-foundation"] }
objc2-core-foundation = "=0.3.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
sha2 = { workspace = true }
