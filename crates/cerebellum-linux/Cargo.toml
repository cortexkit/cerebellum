[package]
name = "cerebellum-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Linux process readings, ptrace launch barrier and read-only EDS D-Bus transport for ck-cerebellum. One of two seam crates in the workspace permitted to contain unsafe code."

[features]
bridge-test-identities = ["cerebellum-bridge-protocol/bridge-test-identities"]
desk-probe = []

[lib]
name = "cerebellum_linux"
path = "src/lib.rs"

[dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
cerebellum-bridge-protocol = { path = "../cerebellum-bridge-protocol" }
ed25519-dalek = { version = "=2.2.0", default-features = false }
sha2 = { workspace = true }
serde = { workspace = true }
# Pure Rust/MIT: no libdbus, GLib or EDS link-time dependency.
zbus = { version = "=6.3.0", default-features = false, features = ["proxy", "tokio"] }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "=6.3.0", default-features = false, features = ["service", "tokio"] }

[[example]]
name = "eds_desk_probe"
required-features = ["desk-probe"]
test = true
