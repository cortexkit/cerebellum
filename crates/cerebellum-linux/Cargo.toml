[package]
name = "cerebellum-linux"
version = "0.1.0"
edition = "2021"
publish = false
description = "Raw Linux process readings and ptrace launch barrier for ck-cerebellum. One of two seam crates in the workspace permitted to contain unsafe code."

[lib]
name = "cerebellum_linux"
path = "src/lib.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
sha2 = { workspace = true }
