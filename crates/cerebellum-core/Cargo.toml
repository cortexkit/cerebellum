[package]
name = "cerebellum-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The plane-agnostic substrate for ck-cerebellum: three-fact bind identity, insulated health-v2, dispatch timing atomics, the monotonic clock, principal default-deny, and config parsing. Vendored one-way by each plane's module crate."

[features]
default = []
# Enables the in-memory identity-resolution observer for conformance tests only.
# Production builds leave this feature disabled, so no observer code is emitted.
test-observer = []
# Reject detached dispatch commitments in downstream fixture tests only.
test-support = []

[lib]
name = "cerebellum_core"
path = "src/lib.rs"

[dependencies]
subc-protocol = { workspace = true }
subc-jsonc = { workspace = true }
cortexkit-store-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
cortexkit-lease = "=0.1.3"

[target.'cfg(windows)'.dev-dependencies]
cortexkit-lease = { version = "=0.1.3", features = ["test-support"] }
