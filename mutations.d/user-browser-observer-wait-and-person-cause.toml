
[[control]]
id = "user-browser-read-refuses-observer-only-at-the-bound"
guards = "a snapshot whose observer never arrives refuses observer_unavailable only after the full observer wait"
file = "crates/cerebellum/src/user_browser.rs"
old = "if observed.observer_available || now >= bound {"
new = "if observed.observer_available || now + OBSERVER_WAIT / 4 >= bound {"
edits = []
test_file = "crates/cerebellum/src/user_browser/tests/observer_wait.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["user_browser::tests::observer_wait::snapshot_refuses_an_observer_that_never_arrives_only_at_the_bound"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "async fn observed_document(&self, tab: &str) -> Result<Document, Value> {"
before = "async fn serve_inner("


