[[control]]
id = "unwatched-settle-keeps-the-ordinary-read-budget"
guards = "a settle after an action that did not front the application reads with the ordinary budget, so a slow application's tree is not truncated at the 50 ms poll interval"
file = "crates/cerebellum/src/computer_capability/element_actions.rs"
old = "        } else {\n            ReadBounds::default()\n        };"
new = "        } else {\n            ReadBounds { timeout: SETTLE_POLL.min(deadline.saturating_duration_since(Instant::now())), ..ReadBounds::default() } // NON-VACUITY BREAK\n        };"
edits = []
test_file = "crates/cerebellum/src/computer_capability/fronting_tests.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["computer_capability::fronting_tests::settle_read_budget::an_unwatched_settle_reads_a_slow_application_whole"]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "watched-settle-adopts-no-read-cut-short"
