[[control]]
id = "global-drag-registration-excludes-fronts"
guards = "a global drag cannot register after guard zero while another lane still holds the process-wide fronting lock"
file = "crates/cerebellum/src/computer_capability/held_input.rs"
old = "        let exclusion = lock.take(cancel).await?;\n        let ticket = self.begin_send(press, terminal);\n        self.state\n            .lock()\n            .unwrap()\n            .fronting_exclusions\n            .insert(ticket.id, exclusion);"
new = "        let ticket = self.begin_send(press, terminal); // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/src/computer_capability/fronting_tests.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["computer_capability::fronting_tests::a_global_drag_starting_after_guard_zero_waits_until_the_front_finishes"]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "person-input-restores-without-a-final-ax-read"
