runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["computer_capability::fronting_tests::person_input_requests_restore_before_a_slow_settle_read"]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "preview-skip-default-is-a-nonzero-process-exit"
guards = "a forced preview_hide skip exits two by default and exits zero only when the caller explicitly accepts and reports skips"
file = "crates/cerebellum-macos/tests/preview_hide.rs"
old = "    std::process::exit(if accepted { 0 } else { 2 });"
new = "    std::process::exit(if accepted { 0 } else { 0 }); // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum-macos/tests/preview_hide.rs"
runner = "cargo"
package = "cerebellum-macos"
target = "--test preview_hide"
platforms = ["macos"]
select = "expected"
expect_red = ["a_preview_skip_is_nonzero_unless_explicitly_accepted"]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "terminal-actually-releases-before-requesting-restore"
guards = "terminal cleanup requests the restore only after the release job returns, not merely reporting a released state"
edits = [
    { file = "crates/cerebellum/src/terminal_arbiter.rs", old = "        let decided = match &restore {\n            Some(cell) => Some(finish_restore(Arc::clone(cell), held, suffix_end, &planes).await),\n            None => None,\n        };", new = "        // The restore already ran before the release. NON-VACUITY BREAK" },
    { file = "crates/cerebellum/src/terminal_arbiter.rs", old = "        let mut held = None;", new = "        let decided = match &restore { // NON-VACUITY BREAK\n            Some(cell) => Some(finish_restore(Arc::clone(cell), None, suffix_end, &planes).await),\n            None => None,\n        };\n        let mut held = None;" },
]
test_file = "crates/cerebellum/src/terminal_arbiter.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["terminal_arbiter::restore_slot_tests::held_input_is_released_before_the_restore_and_both_are_reported"]
only = false
timeout_s = 600
build_timeout_s = 1800

