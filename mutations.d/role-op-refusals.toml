[[control]]
id = "role-op-preset-refused-by-name"
guards = "a role op carrying a non-null preset is refused by name, since this provider serves no presets"
file = "crates/cerebellum/src/tool_provider.rs"
old = "    if let Some(preset) = object.get(\"preset\").filter(|value| !value.is_null()) {"
new = "    if let Some(preset) = object.get(\"preset\").filter(|value| !value.is_null() && false) { // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/tests/it/late_results.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = [
    "late_results::role_op_refusals_are_error_frames_naming_the_field",
]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "role-op-refusal-is-an-error-frame"
guards = "a role op's envelope refusal is an ERROR frame, which a caller cannot mistake for the op's answer"
file = "crates/cerebellum/src/tool_provider.rs"
old = """        return send_error(
            malformed(field, "unknown_field"),
            (ver, channel, epoch, corr),
            writer,
        )
        .await;"""
new = """        return send_invalid_request_response(writer, ver, channel, epoch, corr, field, "unknown_field").await; // NON-VACUITY BREAK"""
edits = []
test_file = "crates/cerebellum/tests/it/late_results.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = [
    "late_results::role_op_refusals_are_error_frames_naming_the_field",
]
only = false
timeout_s = 600
build_timeout_s = 1800
