[[control]]
id = "consent-no-expiry-requires-capability"
guards = "older Cingulate still receives its required card deadline on every card kind"
file = "crates/cerebellum/src/cingulate_client/features.rs"
old = "if features.no_expiry {"
new = "if true { // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/src/cingulate_client/tests/no_expiry.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["cingulate_client::tests::no_expiry::mutation_expiry_is_omitted_only_for_advertised_peers_on_every_card"]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "consent-execution-report-is-once"
guards = "an answered card receives only one final execution report, including after restart"
file = "crates/cerebellum/src/cingulate_client/desk.rs"
old = "match classify_report_delivery(&reply, card.lifecycle.acked) {"
new = "let _ = self.record(wire::CONSENT_REPORT_EXECUTION, wire::report_execution_with_reason(&card.elicitation_id, report.execution, reason)).await; // NON-VACUITY BREAK\n                match classify_report_delivery(&reply, card.lifecycle.acked) {"
edits = []
test_file = "crates/cerebellum/src/cingulate_client/tests/no_expiry.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["cingulate_client::tests::no_expiry::mutation_execution_is_reported_once_across_restart"]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "consent-tombstone-is-never-approval"
guards = "a retention tombstone says the answer was lost, not that login capture was approved"
file = "crates/cerebellum/src/cingulate_client/desk.rs"
old = "CardState::Expired | CardState::Other(_) => Self::NoAnswer,"
new = "CardState::Expired => Self::Granted { choice_id: card.grant_ids[0].clone() }, // NON-VACUITY BREAK\n            CardState::Other(_) => Self::NoAnswer,"
edits = []
test_file = "crates/cerebellum/src/cingulate_client/tests/no_expiry.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["cingulate_client::tests::no_expiry::mutation_tombstone_is_answer_lost_and_never_a_login_approval"]
only = false
timeout_s = 600
build_timeout_s = 1800
