
[[control]]
id = "screen-text-redacted-before-journal-serialization"
guards = "screen text in an alternate accessibility title is withheld from serialized audit entries"
file = "crates/cerebellum-computer/src/audit/redaction.rs"
old = 'let described = format!("{WITHHELD_MARKER} {} bytes", input.len());'
new = "let described = input.to_string();"
edits = []
test_file = "crates/cerebellum-computer/tests/it/c2_s2_audit.rs"
runner = "cargo"
package = "cerebellum-computer"
target = "--test it"
select = "expected"
expect_red = ["c2_s2_audit::identifier_addressed_actuation_journals_no_screen_text"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "fn redact(&self, input: &str, max_bytes: usize) -> Result<String, RedactionUnavailable> {"
before = "if described.len() > max_bytes {"


[[control]]
id = "typed-write-text-is-not-journal-intent"
guards = "write-text payloads are excluded from durable element-intent records"
file = "crates/cerebellum/src/computer_capability/element_actions.rs"
old = "journal.intent(grant, element_id, action, &role)"
new = 'journal.intent(grant, element_id, action, &format!("{role}{text}"))'
