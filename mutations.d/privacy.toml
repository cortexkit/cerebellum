runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = ["no_runtime_output::shipped_code_prints_nothing"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "pub fn public_web_baseline_covers("
