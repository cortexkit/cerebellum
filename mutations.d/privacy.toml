test_file = "crates/cerebellum/tests/it/computer_element_actions.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = ["computer_element_actions::written_and_typed_text_never_reach_the_journal"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "pub(crate) fn write_blocking<R, T, S>("
before = "// One attempt. Whether the application accepted the message or not,"


[[control]]
id = "production-println-is-caught-by-zero-prints-scan"
guards = "the workspace zero-prints scan rejects production println macros"
file = "crates/cerebellum/src/authorization.rs"
old = "required.tier <= COMPOSE"
new = """
println!("mutation output");
    required.tier <= COMPOSE"""
edits = []
