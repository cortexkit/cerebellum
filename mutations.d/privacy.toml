[[control]]
id = "launch-nonce-has-one-production-reader"
guards = "only launch_nonce.rs may call the launch nonce accessor"
file = "crates/cerebellum/src/permissions.rs"
old = "matches!(method, LIST | REVOKE)"
new = """
let _ = subc_os::launch_nonce();
    matches!(method, LIST | REVOKE)"""
edits = []
test_file = "crates/cerebellum/tests/it/one_launch_nonce_reader.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = ["one_launch_nonce_reader::only_launch_nonce_rs_reads_the_launch_nonce"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
