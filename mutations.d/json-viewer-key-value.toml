[[control]]
id = "text-zoom-counts-letters-and-digits"
guards = "a dom_full zoom on a key's text climbs past its chip ('event':), which adds only punctuation, to the property line holding the value"
file = "crates/cerebellum/src/browser/zoom.rs"
old = ".filter(|character| character.is_alphanumeric())"
new = ".filter(|_| true) // NON-VACUITY BREAK: count every character"
edits = []
test_file = "crates/cerebellum/src/browser/zoom.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = [
  "browser::zoom::tests::a_text_zoom_on_a_json_viewer_key_climbs_past_its_punctuated_chip_to_the_line",
]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "key-chip-is-part-of-the-key"
guards = "a click-to-filter chip whose letters and digits are exactly the matched key belongs to the key: it neither refuses the row nor leaves the line without a label, and it keeps its ref"
file = "crates/cerebellum/src/browser/state_text.rs"
old = "        text == key"
new = "        false && text == key // NON-VACUITY BREAK: no control is a key chip"
edits = []
test_file = "crates/cerebellum/src/browser/state_text.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = [
  "browser::state_text::tests::a_key_chip_in_a_table_cell_prints_with_its_value_and_keeps_its_ref",
  "browser::state_text::tests::a_text_filter_on_a_json_viewer_key_chip_prints_its_property_line",
]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "fn is_key_chip("
before = "fn row_block("

[[control]]
id = "leaf-zoom-prints-the-full-name"
guards = "a zoom on a single element whose name its cap cut prints the whole stored name, within max_bytes, marked when still cut"
file = "crates/cerebellum/src/browser/state_text.rs"
old = "                        lines[0].text = text;"
new = "                        let _ = text; // NON-VACUITY BREAK: keep the capped name"
edits = []
test_file = "crates/cerebellum/src/browser/state_text.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = [
  "browser::state_text::tests::a_zoom_on_a_single_element_prints_its_whole_name",
]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "container-zoom-keeps-the-name-cap"
guards = "a zoom on a container keeps its name capped, since a container's name repeats the subtree it heads"
file = "crates/cerebellum/src/browser/state_text.rs"
old = "                .any(|&kid| self.role(kid) != \"StaticText\" || !self.kids[kid].is_empty())"
new = "                .any(|&kid| false && self.role(kid) != \"StaticText\") // NON-VACUITY BREAK: containers too"
edits = []
test_file = "crates/cerebellum/src/browser/state_text.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = [
  "browser::state_text::tests::a_zoom_on_a_container_keeps_its_name_capped",
]
only = false
timeout_s = 600
build_timeout_s = 1800
