[[control]]
id = "desk-display-capture-module-needs-explicit-feature"
guards = "the manual single-window capture probe is absent unless desk-probe is enabled"
file = "crates/cerebellum-macos/src/cursor_overlay.rs"
old = "#[cfg(feature = \"desk-probe\")]\nmod capture_probe;"
new = "mod capture_probe; // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/tests/it/agent_cursor_source.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = ["agent_cursor_source::single_window_capture_probe_module_and_exports_require_the_desk_probe_feature"]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "display-capture-cannot-escape-the-probe-source"
guards = "a display-capture selector in any macOS source is rejected, including the opt-in probe"
file = "crates/cerebellum-macos/src/cursor_overlay/preview_window.rs"
old = "use std::cell::{Cell, RefCell};"
new = "use std::cell::{Cell, RefCell};\nconst _: () = { let _ = objc2_screen_capture_kit::SCContentFilter::initWithDisplay_excludingWindows; }; // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/tests/it/agent_cursor_source.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = ["agent_cursor_source::display_capture_is_absent_and_the_probe_uses_production_single_window_capture"]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "preview-skip-relaunch-must-copy-its-own-binary"
guards = "the reviewed private tmp relocation cannot launch an arbitrary executable binding"
file = "crates/cerebellum-macos/tests/preview_hide.rs"
old = "    let executable = std::env::current_exe().map_err(|e| e.to_string())?;"
new = "    let executable = std::env::current_dir().map_err(|e| e.to_string())?; // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/tests/it/tests_never_headed.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = ["tests_never_headed::test_browser_spawns_cannot_bypass_the_headless_helper"]
only = false
timeout_s = 600
build_timeout_s = 1800
