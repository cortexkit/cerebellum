[[control]]
id = "text-filter-match-prints-its-row-block"
guards = "a text_filter match outside a table prints its nearest bounded row block, so an app's name prints with its Configure link and each Configure link with its app's name"
file = "crates/cerebellum/src/browser/state_text.rs"
old = "                return Some(ancestor);"
new = "                return None; // NON-VACUITY BREAK: never print a row block"
edits = []
test_file = "crates/cerebellum/src/browser/navigation/mod.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = [
  "browser::navigation::tests::a_text_filter_match_on_an_app_name_prints_its_row_with_the_configure_link",
  "browser::navigation::tests::a_text_filter_match_on_a_row_link_prints_the_name_of_its_app",
  "browser::state_text::tests::a_match_whose_row_is_over_the_row_bound_prints_as_itself",
]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "fn row_block("
before = "fn is_row_block("

