[[control]]
id = "codemode-parent-linked"
guards = "a run resolves no context until its parent is linked"
file = "crates/cerebellum/src/codemode.rs"
old = "if run.parent_state != Some(ParentState::Linked) {"
new = "if false { /* NON-VACUITY BREAK */"
runner = "cargo"
package = "cerebellum"
target = "--lib"
test_file = "crates/cerebellum/src/call_mode_tests.rs"
select = "expected"
expect_red = ["call_mode_tests::run_parent_must_be_linked"]
only = true
timeout_s = 30
build_timeout_s = 1200

[[control]]
id = "codemode-agent-match"
guards = "the run agent equals the provider-admitted head agent"
file = "crates/cerebellum/src/codemode.rs"
old = "if run.attributes.agent_id.as_deref() != Some(head.identity.agent_project_id.as_str()) {"
new = "if false { /* NON-VACUITY BREAK */"
runner = "cargo"
package = "cerebellum"
target = "--lib"
test_file = "crates/cerebellum/src/call_mode_tests.rs"
select = "expected"
expect_red = ["call_mode_tests::run_agent_must_match_attested_head"]
only = true
timeout_s = 30
build_timeout_s = 1200

[[control]]
id = "codemode-parent-epoch"
guards = "a live head route at another epoch cannot satisfy the parent"
file = "crates/cerebellum/src/codemode.rs"
old = "&& stamp.scope_epoch == parent.scope_epoch"
new = "&& true /* NON-VACUITY BREAK */"
runner = "cargo"
package = "cerebellum"
target = "--lib"
test_file = "crates/cerebellum/src/call_mode_tests.rs"
select = "expected"
expect_red = ["call_mode_tests::run_requires_live_head_at_parent_epoch"]
only = true
timeout_s = 30
build_timeout_s = 1200

[[control]]
id = "codemode-head-attested"
guards = "a raw head stamp does not substitute for provider attestation"
file = "crates/cerebellum/src/codemode.rs"
old = "&& facts.agent_project_id_attested"
new = "&& true /* NON-VACUITY BREAK */"
runner = "cargo"
package = "cerebellum"
target = "--lib"
test_file = "crates/cerebellum/src/call_mode_tests.rs"
select = "expected"
expect_red = ["call_mode_tests::run_head_identity_requires_provider_attestation"]
only = true
timeout_s = 30
build_timeout_s = 1200

[[control]]
id = "codemode-run-id"
guards = "Basal requires a run id on the narrow codemode admission path"
file = "crates/cerebellum-core/src/identity.rs"
old = "&& stamp.attributes.run_id.is_some()"
new = "&& true /* NON-VACUITY BREAK */"
runner = "cargo"
package = "cerebellum"
target = "--lib"
test_file = "crates/cerebellum/src/call_mode_tests.rs"
select = "expected"
expect_red = ["call_mode_tests::basal_requires_run_id_and_codemode"]
only = true
timeout_s = 30
build_timeout_s = 1200
[control.scope]
after = "pub fn codemode_carrier_candidate("
before = "fn scope_admission_eligible("

[[control]]
id = "codemode-call-mode"
guards = "Basal without codemode is not admitted as a run carrier"
file = "crates/cerebellum-core/src/identity.rs"
old = "&& *mode == subc_protocol::call_mode::CallMode::Codemode"
new = "&& true /* NON-VACUITY BREAK */"
runner = "cargo"
package = "cerebellum"
target = "--lib"
test_file = "crates/cerebellum/src/call_mode_tests.rs"
select = "expected"
expect_red = ["call_mode_tests::basal_requires_run_id_and_codemode"]
only = true
timeout_s = 30
build_timeout_s = 1200

[[control]]
id = "codemode-head-images"
guards = "computer images and elements use the head conversation, never the carrier session"
file = "crates/cerebellum-core/src/identity.rs"
old = "self.identity = head.identity.clone();"
new = "self.identity = head.identity.clone(); self.identity.conversation_key = \"misleading-session\".into(); /* NON-VACUITY BREAK */"
runner = "cargo"
package = "cerebellum"
target = "--lib"
test_file = "crates/cerebellum/src/call_mode_tests.rs"
select = "expected"
expect_red = ["call_mode_tests::run_resolves_head_computer_images_and_elements_not_run_bind_handles"]
only = true
timeout_s = 30
build_timeout_s = 1200

