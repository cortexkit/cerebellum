[[control]]
id = "observer-success-does-not-wait-out-the-bound"
guards = "a late observer yields a successful snapshot before the observer wait expires, measured only on paused Tokio time"
file = "crates/cerebellum/src/user_browser.rs"
old = "if observed.observer_available || now >= bound {"
new = "if observed.observer_available { tokio::time::sleep(OBSERVER_WAIT).await; } // NON-VACUITY BREAK\n                if observed.observer_available || now >= bound {"
edits = []
test_file = "crates/cerebellum/src/user_browser/tests/observer_wait.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["user_browser::tests::observer_wait::snapshot_waits_for_an_observer_that_arrives_late"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "async fn observed_document(&self, tab: &str) -> Result<Document, Value> {"
before = "async fn serve_inner("

