
[[control]]
id = "nondelegating-flow-keeps-owner-identity-unattested"
guards = "admitted nondelegating flows retain no owner identity or attestation before browser dispatch"
file = "crates/cerebellum-core/src/identity.rs"
old = ".filter(|_| self.flow_id.is_none() || stamp.attributes.delegates)"
new = ".filter(|_| true) /* NON-VACUITY BREAK */"
edits = []
test_file = "crates/cerebellum/tests/browser_session_wire.rs"
runner = "cargo"
package = "cerebellum"
target = "--test browser_session_wire"
select = "expected"
expect_red = ["nondelegating_basal_flow_cannot_use_its_agents_standing_grant"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "    pub fn with_scope("
before = "    pub fn admission_facts_refusal("
