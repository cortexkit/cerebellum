
[[control]]
id = "person-focus-change-refuses-input"
guards = "input is refused after the person's focused element changes"
file = "crates/cerebellum-computer/src/app_state/person.rs"
old = "if !same {"
new = "if false && !same {"
edits = []
test_file = "crates/cerebellum/tests/it/computer_person_changes.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = ["computer_person_changes::after_the_refusal_a_read_lets_the_press_through"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "pub fn person_change("
before = "if let (Reading::Read(before), Reading::Read(after)) = (&seen.window, &now.window) {"


