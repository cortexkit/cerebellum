[[control]]
id = "exec-chain-deadline-refuses-mid-exec"
platforms = ["linux"]
guards = "a changed image at the deadline is unresolved, not a stable final-image mismatch"
file = "crates/cerebellum/src/browser_launch.rs"
old = "if current.as_ref().is_ok_and(|image| image == observed) {"
new = "if current.as_ref().is_ok_and(|image| image == observed || image != observed) { // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/src/browser_launch.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["browser_launch::tests::linux_probe_deadline_refuses_an_image_changed_during_exec"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "fn linux_probe_image_at_deadline("
before = "impl From<PlatformLaunchError> for LinuxProbeError"
