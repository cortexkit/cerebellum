[[control]]
id = "exec-chain-quiet-window-is-not-final"
platforms = ["linux"]
guards = "a delayed wrapper reaches the pinned terminal image instead of being mistaken for its interpreter"
file = "crates/cerebellum/src/browser_launch.rs"
old = ".continue_to_next_exec_stop_with_deadline(LINUX_EXEC_CHAIN_HOP_LIMIT, deadline)"
new = ".continue_to_next_exec_stop_with_deadline(LINUX_EXEC_CHAIN_HOP_LIMIT, deadline.min(std::time::Instant::now() + LINUX_EXEC_CHAIN_PROBE_WINDOW)) // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/src/browser_config.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["browser_config::tests::config_load_accepts_a_pin_for_the_terminal_image"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "pub(crate) fn probe_configured_executable("
before = "pub(crate) enum LinuxProbeError"

