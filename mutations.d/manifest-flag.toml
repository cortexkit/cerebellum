[[control]]
id = "manifest-flag-answers-before-module-startup"
guards = "--manifest answers with JSON build provenance under an empty home without starting the module or creating stores"
file = "crates/cerebellum/src/main.rs"
old = "    if std::env::args().skip(1).any(|arg| arg == \"--manifest\") {"
new = "    if std::env::args().skip(1).any(|arg| arg == \"--manifest-disabled\") { // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/tests/manifest_flag.rs"
runner = "cargo"
package = "cerebellum"
target = "--test manifest_flag"
select = "expected"
expect_red = ["manifest_flag_is_isolated_and_reports_build_provenance"]
only = false
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "manifest-inspection-never-reads-launch-nonce"
guards = "offline inspection builds provenance without consulting launch-secret delivery"
file = "crates/cerebellum/src/lib.rs"
old = "        manifest::build_offline_provenance(),"
new = "        manifest::build_provenance(), // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/tests/manifest_flag.rs"
runner = "cargo"
package = "cerebellum"
target = "--test manifest_flag"
select = "expected"
expect_red = ["manifest_flag_is_isolated_and_reports_build_provenance"]
only = false
timeout_s = 600
build_timeout_s = 1800
