
[[control]]
id = "browser-credential-classification"
guards = "credential fields remain ineligible for browser typing"
file = "crates/cerebellum/src/browser_type.rs"
old = "credential,"
new = "credential: false,"
edits = []
test_file = "crates/cerebellum/src/browser_type.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["browser_type::tests::credential_and_financial_targets_are_refused_before_authorization"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "pub fn classification(&self) -> ClassificationRecord {"
before = """

    }
}"""


