[[control]]
id = "extension-attach-probe-must-confirm-own-session"
guards = "a failed own-session detach probe never retries an attach held by another debugger"
file = "extension/agent.mjs"
old = 'catch { throw attachRefusal(error, "another_debugger"); }'
new = 'catch { /* NON-VACUITY BREAK: retry without proof of our own session. */ }'
edits = []
test_file = "extension/tests/attach.test.mjs"
runner = "command"
command = ["node", "--test", "--test-reporter=tap", "--test-name-pattern", "{test}", "extension/tests/attach.test.mjs"]
list_command = ["node", "extension/list-test-names.mjs", "extension/tests/attach.test.mjs", "{test}"]
test_count_pattern = "# tests {count}\n"
expect_red = ["another holder is never retried when the own-session detach probe rejects"]
timeout_s = 60

[[control]]
id = "extension-attach-never-detaches-an-active-plan"
guards = "a competing prepare never detaches a debugger attachment owned by an active plan"
file = "extension/agent.mjs"
old = 'if ([...this.active].some(other => other !== state && other.tabId === state.tabId && other.attached)) throw attachRefusal(error, "active_plan");'
new = 'if (false) throw attachRefusal(error, "active_plan"); // NON-VACUITY BREAK: detach another active plan.'
edits = []
test_file = "extension/tests/attach.test.mjs"
runner = "command"
command = ["node", "--test", "--test-reporter=tap", "--test-name-pattern", "{test}", "extension/tests/attach.test.mjs"]
list_command = ["node", "extension/list-test-names.mjs", "extension/tests/attach.test.mjs", "{test}"]
test_count_pattern = "# tests {count}\n"
expect_red = ["an attached active plan is never detached by a competing prepare"]
timeout_s = 60
