[[control]]
id = "user-dom-full-main-first-with-zoomable-markers"
guards = "over-limit user-browser markup puts main content first and retains the refs printed in cut chrome markers"
file = "crates/cerebellum/src/user_browser.rs"
old = "let layout = dom_layout::lay_out(&documents.join(\"\\n\"), &landmarks, max_bytes);"
new = "let layout = dom_layout::lay_out(&documents.join(\"\\n\"), &[], max_bytes);"
edits = []
test_file = "crates/cerebellum/src/user_browser/tests/dom_full.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["user_browser::tests::dom_full::over_limit_main_comes_first_and_cut_chrome_refs_are_retained"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "async fn capture_attempt("
before = "async fn screenshot("

[[control]]
id = "user-dom-full-zoom-reads-the-named-node"
guards = "dom_full zoom reads the saved backend node's outerHTML rather than the whole frame"
file = "crates/cerebellum/src/user_browser.rs"
old = ".map(|reference| reference.identity.backend_node_id)"
new = ".and_then(|_| None::<u64>)"
edits = []
test_file = "crates/cerebellum/src/user_browser/tests/dom_full.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["user_browser::tests::dom_full::dom_full_zoom_reads_the_named_outer_html_and_ax_still_refuses_zoom"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "let root = expected_zoom"
before = "let Some(root) = root else"

[[control]]
