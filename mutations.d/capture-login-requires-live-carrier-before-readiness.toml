
[[control]]
id = "capture-login-requires-live-carrier-before-readiness"
guards = "capture calls without a live carrier refuse before exposing browser readiness or producing effects"
file = "crates/cerebellum/src/login_capture/mod.rs"
old = """
        if let Err(not_live) = call.consent.carrier.live() {
            let why = NoCard::of_not_live(not_live);
            return record.refused(
                "consent_unavailable",
                json!({"detail":{"reason":why.reason(), "remedy":why.remedy()}}),
            );
        }"""
new = """
        if false { // NON-VACUITY BREAK
        if let Err(not_live) = call.consent.carrier.live() {
            let why = NoCard::of_not_live(not_live);
            return record.refused(
                "consent_unavailable",
                json!({"detail":{"reason":why.reason(), "remedy":why.remedy()}}),
            );
        }
        }"""
edits = []
test_file = "crates/cerebellum/src/lib.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["tests::capture_login_without_live_carrier_refuses_before_readiness_or_effects"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "    async fn run_consented<Cancelled>("
before = "        let Some(launcher) = self.launcher() else {"
