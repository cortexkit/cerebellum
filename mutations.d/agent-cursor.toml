[[control]]
id = "agent-cursor-end-sends-the-hide"
guards = "Coordinator::end, the one entry for route close, computer-call cancel and turn end, actually sends that agent's hide line"
file = "crates/cerebellum/src/computer_capability/cursor.rs"
old = "        self.send_line(CursorLine::Hide(CursorHide::new(agent)));"
new = "        let _ = CursorHide::new(agent); // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/src/cursor_end_tests.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = [
    "computer_capability::cursor::tests::end_hides_only_the_named_agent_and_needs_a_transport",
    "computer_capability::cursor::tests::turn_ended_matches_the_scope_ref_whatever_its_epoch",
    "computer_capability::cursor::tests::a_picture_scheduled_before_an_end_does_not_bring_the_badge_back",
    "cursor_end_tests::cancel_of_a_computer_call_ends_only_that_calls_badge",
    "cursor_end_tests::goodbye_ends_only_the_badges_its_route_drew",
    "cursor_end_tests::turn_ended_for_one_session_hides_its_badge_and_not_another",
    "cursor_end_tests::a_failed_turn_with_its_error_class_hides_the_badge",
]
