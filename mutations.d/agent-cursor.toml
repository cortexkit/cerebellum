[[control]]
id = "agent-cursor-badge-stays-while-its-agent-acts"
guards = "an agent cursor badge stays fully visible until its agent has sent no event for 30 s, rather than fading 1.5 s after each action"
file = "crates/cerebellum-macos/src/cursor_schedule.rs"
old = "pub(crate) const IDLE_FADE_AFTER: Duration = Duration::from_secs(30);"
new = "pub(crate) const IDLE_FADE_AFTER: Duration = Duration::from_millis(1500); // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum-macos/src/cursor_schedule.rs"
runner = "cargo"
package = "cerebellum-macos"
target = "--lib"
select = "expected"
expect_red = [
    "cursor_schedule::tests::picture_stays_fully_visible_for_29_seconds_then_fades_after_30",
    "cursor_schedule::tests::event_at_20_seconds_keeps_the_picture_visible_until_50",
    "cursor_schedule::tests::resting_picture_asks_for_a_timed_wait_not_frame_ticks",
    "cursor_schedule::tests::earliest_fade_deadline_wins_across_resting_pictures",
    "cursor_schedule::tests::faded_picture_is_dropped_and_never_ticked_again",
]
only = false
timeout_s = 600
build_timeout_s = 1800

