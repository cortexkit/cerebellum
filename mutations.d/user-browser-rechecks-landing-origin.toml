
[[control]]
id = "user-browser-rechecks-landing-origin"
guards = "redirected content stays withheld until the landing origin has its own grant"
file = "crates/cerebellum/src/user_browser.rs"
old = "        if let Some(grant) = once {"
new = """
        if !origin.is_empty() { return true; } // NON-VACUITY BREAK
        if let Some(grant) = once {"""
edits = []
test_file = "crates/cerebellum/src/user_browser/tests.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["user_browser::tests::redirect_to_ungranted_landing_site_exposes_no_content"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "    fn granted("
before = "    async fn authorize("
