
[[control]]
id = "format-floor-raise-records-before-write"
guards = "a format floor is durably raised before the writer records its format"
file = "crates/cerebellum-core/src/format_floor.rs"
old = "raise_on_disk(path, format)?;"
new = "Ok(())?;"
edits = []
test_file = "crates/cerebellum-core/src/format_floor.rs"
runner = "cargo"
package = "cerebellum-core"
target = "--lib"
select = "expected"
expect_red = ["format_floor::tests::a_raise_records_the_version_in_the_floor_file"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "pub fn raise(&self, format: DurableFormat) -> Result<(), FloorError> {"
before = """

}
"""


[[control]]
id = "format-floor-never-lowers-recorded-version"
guards = "raising a format floor never lowers a version already written"
file = "crates/cerebellum-core/src/format_floor.rs"
old = "if current >= format.version {"
new = "if current == format.version {"
edits = []
test_file = "crates/cerebellum-core/src/format_floor.rs"
runner = "cargo"
package = "cerebellum-core"
target = "--lib"
select = "expected"
expect_red = ["format_floor::tests::the_floor_is_never_lowered"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "fn raise_on_disk(path: &Path, format: DurableFormat) -> Result<(), FloorError> {"
before = "floors.insert(format.name.to_string(), format.version);"


