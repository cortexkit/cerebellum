
[[control]]
id = "format-floor-at-does-not-upgrade-existing-data"
guards = "opening a floor cannot raise a durable format before a record is written"
file = "crates/cerebellum-core/src/format_floor.rs"
old = """
    pub fn at(path: impl Into<PathBuf>) -> Self {
        Self {"""
new = """
    pub fn at(path: impl Into<PathBuf>) -> Self {
        let path = path.into();
        let _ = raise_on_disk(&path, FORMAT_FLOOR_FORMAT); // NON-VACUITY BREAK
        Self {"""
edits = []
test_file = "crates/cerebellum-core/src/journal/storage.rs"
runner = "cargo"
package = "cerebellum-core"
target = "--lib"
select = "expected"
expect_red = ["journal::storage::tests::unpositioned_records_keep_v3_and_leave_the_existing_floor_byte_identical"]
only = false
timeout_s = 600
build_timeout_s = 1800
