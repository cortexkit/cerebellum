[[control]]
id = "capture-audit-signals-finalization"
guards = "the capture privacy test waits for detached journal finalization, not just the late result"
file = "crates/cerebellum/src/lib.rs"
old = "let _ = finalized.send(());"
new = "drop(finalized); // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/src/lib.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["tests::capture_login_keeps_the_value_out_of_the_reply_the_journal_and_the_ask"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "async fn capture_browser_login("
before = "fn capture_ending("

[[control]]
id = "withdrawal-scope-waits-for-settled-record"
guards = "the withdrawal scope test observes its settlement precondition and fails if that precondition cannot finish"
file = "crates/cerebellum/tests/it/tool_catalog.rs"
old = "if snapshot.state != CallState::Started {"
new = "if false && snapshot.state != CallState::Started { // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/tests/it/tool_catalog.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = ["tool_catalog::withdrawal_checks_the_carriers_own_record_scope"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "async fn withdrawal_checks_the_carriers_own_record_scope() {"
before = "async fn withdrawal_validation_is_a_contract_route_error() {"
