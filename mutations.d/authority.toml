
[[control]]
id = "flow-carrier-exact-basal-principal"
guards = "only the basal principal can use an authorized core flow carrier"
file = "crates/cerebellum-core/src/identity.rs"
old = """
principal.as_ref()
            == Some(&Principal::Reserved {
                module_id: "basal".into(),
            })"""
new = "true"
edits = []
test_file = "crates/cerebellum/tests/browser_session_wire.rs"
runner = "cargo"
package = "cerebellum"
target = "--test browser_session_wire"
select = "expected"
expect_red = ["flow_carrier_requires_exact_basal_authorized_core_stamp"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "pub fn flow_carrier_admitted("
before = """

}
"""


