[[control]]
id = "consent-card-names-child-frame-origin"
guards = "a consent card for child-frame typing names the child's actual origin"
file = "crates/cerebellum/src/user_browser.rs"
old = "site_question_with_choices(origin, severity.tier, &grant.hazards, &choices)"
new = 'site_question_with_choices("https://example.com", severity.tier, &grant.hazards, &choices)'
edits = []
test_file = "crates/cerebellum/src/user_browser/tests.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["user_browser::tests::cross_origin_child_typing_requires_its_own_origin_card"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "async fn authorize("
before = "let card = consent_request("
