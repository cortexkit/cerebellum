
[[control]]
id = "application-text-redactor-discards-input"
guards = "application-text exclusion never preserves any prefix of the supplied text"
file = "crates/cerebellum-computer/src/audit/redaction.rs"
old = 'let described = format!("{WITHHELD_MARKER} {} bytes", input.len());'
new = "let described = input.to_string(); // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum-computer/src/audit/redaction.rs"
runner = "cargo"
package = "cerebellum-computer"
target = "--lib"
select = "expected"
expect_red = ["audit::redaction::tests::no_fragment_of_the_input_survives"]
only = false
timeout_s = 600
build_timeout_s = 1800

[control.scope]
after = "    fn redact(&self, input: &str, max_bytes: usize) -> Result<String, RedactionUnavailable> {"
before = "        if described.len() > max_bytes {"
