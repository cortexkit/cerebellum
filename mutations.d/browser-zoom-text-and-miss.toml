[[control]]
id = "browser-dom-text-zoom-enclosing-line"
guards = "text refs skip a key-only wrapper and zoom to the line containing its clickable value"
file = "crates/cerebellum/src/browser/zoom.rs"
old = "if text_sizes.get(&id).copied().unwrap_or_default() > own_size {"
new = "if true { // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/src/browser/navigation/mod.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = ["browser::navigation::tests::dom_full_text_zoom_reads_the_key_value_line_without_an_element_selector"]
only = false
timeout_s = 600
build_timeout_s = 1800

