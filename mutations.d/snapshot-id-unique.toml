[[control]]
id = "snapshot-id-carries-per-context-nonce"
guards = "a page context mixes random bits into its snapshot ids, so ids never repeat across contexts or module restarts and a stale id cannot name a new page's snapshot"
file = "crates/cerebellum/src/browser/mod.rs"
old = "snapshot_nonce: new_snapshot_nonce(),"
new = "snapshot_nonce: 0, // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/src/browser/mod.rs"
runner = "cargo"
package = "cerebellum"
target = "--lib"
select = "expected"
expect_red = [
    "browser::tests::snapshot_ids_of_two_contexts_for_one_conversation_are_disjoint",
    "browser::tests::a_snapshot_id_from_a_closed_context_is_stale_on_its_replacement",
]
only = false
timeout_s = 600
build_timeout_s = 1800
