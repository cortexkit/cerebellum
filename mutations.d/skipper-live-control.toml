[[control]]
id = "real-tree-skipper-must-beat-the-blind-control"
guards = "the real-tree skipper check fails when the skipper reads no more than a skipper blind after each file's first test marker"
file = "crates/cerebellum/tests/it/support/source_scan.rs"
old = "            shipped += shipped_lines(&source).len();"
new = "            shipped += blind_shipped_line_count(&source); // NON-VACUITY BREAK"
edits = []
test_file = "crates/cerebellum/tests/it/support/source_scan.rs"
runner = "cargo"
package = "cerebellum"
target = "--test it"
select = "expected"
expect_red = ["support::source_scan::the_skipper_reads_most_of_the_real_tree_as_shipped"]
only = false
timeout_s = 600
build_timeout_s = 1800
