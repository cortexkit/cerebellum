[[control]]
id = "desk-run-tcc-preflight-refuses-false"
guards = "The desk probe refuses every missing privacy permission before any operation that could request access or touch the desk."
file = "crates/cerebellum/examples/app_use_desk_probe.rs"
old = "if !missing.is_empty() {"
new = "if false { // NON-VACUITY BREAK"
test_file = "crates/cerebellum/examples/app_use_desk_probe.rs"
runner = "cargo"
package = "cerebellum"
target = "--example app_use_desk_probe"
features = ["desk-probe"]
expect_red = ["tests::tcc_preflight_refuses_every_missing_permission_before_requesting"]
only = true
timeout_s = 600
build_timeout_s = 1800
