name: CI

on:
  push:
    # train/** must be here BEFORE main gets required status checks: a
    # protected main refuses any sha without a check, and a train push that
    # triggers no workflow never earns one -- main would become unpushable
    # with nothing ever arriving to unblock it.
    branches: [main, 'train/**']
  pull_request:
    branches: [main]
  # The push gate asks "is this change good". This asks "is what already
  # landed still good against the siblings as they are NOW" -- a different
  # question, with an answer that changes on its own. CI clones the sibling
  # at its tip and builds --locked, so a sibling bump makes main red with no
  # commit here; measured fleet-wide 2026-09-06 (same sha: push=success,
  # schedule=failure four hours later). Without this, that red waits for the
  # next push and arrives attached to an unrelated change.
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on Linux even though the computer plane targets macOS, and keeps
  # working now that ScreenCaptureKit and CoreGraphics are linked, because the
  # framework calls live in `cerebellum-macos` behind
  # `[target.'cfg(target_os = "macos")'.dependencies]`. On any other host that
  # crate compiles to an empty library.
  #
  # SO GREEN HERE MEANS LESS THAN IT DID BEFORE THOSE FRAMEWORKS ARRIVED, and
  # the arithmetic is worth stating rather than leaving to be rediscovered: the
  # part of the computer plane that talks to the operating system is NOT COMPILED
  # on this runner at all. Everything above it is -- the vocabulary, grounding,
  # containment, dispatch, capture custody and audit -- which is most of the
  # plane and all of the part that decides anything. What Linux cannot see is the
  # FFI seam itself.
  #
  # That split is deliberate and it is the reason the seam is required to stay
  # thin: code there is code no continuous build checks. Adding judgment to it
  # moves that judgment out of the verified half, silently.
  #
  # This job runs the Linux and Windows halves only. The macOS half runs on the
  # local Mac through scripts/fast-gate.sh, because the live desk tests need a
  # signed binary and real permissions that a hosted runner cannot grant. Since
  # the repository went public, GitHub-hosted macOS runners are free, so a
  # macos-latest job is the way to add hosted coverage for the macOS seam's
  # non-desk tests.
  #
  # Do NOT widen the `cfg` to compile the seam away on macOS too, and do not add
  # a stub implementation to make the untested half look covered. Both hide code
  # from the build meant to verify it, and green would then mean less than it does
  # today while looking like more.
  #
  # WHAT A GREEN RUN HERE DOES NOT COVER: the conformance suite spawns a real
  # subc daemon and measures how long the module takes to register, and on macOS
  # that window includes the kernel validating a freshly built executable's
  # signature on its first execution -- 5 to 22 seconds measured, then cached at
  # ~0. Linux has no such step, so the same test completes in about 0.19s here
  # and this job is structurally incapable of failing on that class of timing
  # fault. It has already produced one flake. Read a green conformance run as
  # "registration works where the expensive step does not happen", and keep
  # running the gate on macOS before trusting a registration-timing change.
  #
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-24.04
    # A wedged test must surface as a fast red run rather than burning the
    # runner for the 6-hour Actions default. Healthy runs finish well under
    # this; the workspace test phase is the long pole at roughly 4 minutes cold.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cerebellum
    steps:
      - name: Checkout cerebellum
        uses: actions/checkout@v5
        with:
          path: cerebellum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Extension tests (nonzero test count required)
        run: node extension/test-gate.mjs

      # CI and local contributors use the same verification script so their
      # definitions cannot drift apart.
      - name: Rust test gate
        run: ./scripts/rust-test-gate.sh

      # `!cancelled()` runs this even when the gate failed. Without it GitHub
      # skips every later step on a failure, so a formatting slip in phase 1
      # would suppress the conformance answer entirely and the job would show a
      # single red mark indistinguishable from "style problem, module fine".
      #
      # The setup steps above stay unguarded on purpose: a failed checkout or
      # toolchain install makes this step impossible rather than skipped by
      # policy, and running it anyway would report a conformance failure whose
      # real cause is a missing dependency.
      #
      # This is the observer-gated conformance binary, which the gate's own
      # final phase also runs. It is repeated here because it is the suite that
      # exercises the live subc daemon end to end, and a green gate with a red
      # conformance run is the single most informative failure this repo can
      # produce.
      - name: Conformance (live subc daemon)
        if: ${{ !cancelled() }}
        run: cargo test -p cerebellum --features test-observer --test conformance

      # Running the gate verbatim keeps CI and the desk from drifting, but it
      # also means both share one execution shape and therefore one blind spot:
      # `cargo test` runs a binary's tests as THREADS IN ONE PROCESS, so a test
      # that only passes because a sibling left state behind -- a populated
      # global, an env var, a changed working directory -- passes here and fails
      # for anyone running that test alone.
      #
      # This step runs the same tests one process each, which is the shape that
      # exposes that dependency and hides the opposite one (a shared-state race
      # between concurrent tests, which only the threaded shape can show). The
      # two are complements; neither is the gate.
      - name: Install nextest
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@nextest

      - name: Test suite, one process per test
        if: ${{ !cancelled() }}
        run: cargo nextest run --workspace

      - name: Native Linux app identity fixtures
        if: ${{ !cancelled() && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        timeout-minutes: 6
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          timeout 90s sudo -n apt-get update -q
          timeout 90s sudo -n apt-get install -qy --no-install-recommends rpm btrfs-progs
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER='sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT unshare --mount --propagation private --'
          cargo test --locked -p cerebellum-linux --lib identity::tests::native_btrfs_private_namespace_and_package_upgrade -- --ignored --exact
          cargo test --locked -p cerebellum-linux --lib identity::packages::tests::native_rpm_reads_real_file_digests_from_a_system_database -- --ignored --exact

  test-windows:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # A cold native workspace run takes about 22 minutes. Leave room for
    # slower runners without letting a wedged test consume hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Native Rust workspace tests
        run: cargo test --locked --workspace --no-fail-fast
      - name: Native Windows browser image predicates
        if: ${{ !cancelled() && matrix.runner == 'windows-latest' }}
        timeout-minutes: 8
        shell: pwsh
        run: ./crates/cerebellum-windows/tests/windows-image-predicates.ps1
