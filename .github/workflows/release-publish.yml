name: Promote reviewed release candidate

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: JSON from the attended review (run_id, source_revision, open_platforms, inventory)
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-promotion
  cancel-in-progress: false

jobs:
  source:
    name: Require the default-branch workflow revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse promotion code from any other ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo '::error::Dispatch promotion from the repository default branch'
            exit 1
          fi

  publish:
    name: Promote candidate after required review
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require the configured promotion environment
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_READY: ${{ vars.CEREBELLUM_RELEASE_ENVIRONMENT_READY }}
        shell: bash
        run: |
          if [[ "$PROMOTION_READY" != 1 ]] || ! gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            | jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))' >/dev/null; then
            echo '::error::Missing or unprotected release environment (requires CEREBELLUM_RELEASE_ENVIRONMENT_READY=1 and a required reviewer)'
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          # Run verification code from the promotion workflow revision, not the candidate.
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Identify one successful tag-triggered release attempt
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZATION: ${{ inputs.authorization }}
        shell: bash
        run: |
          if ! record=$(jq -cse '
            select(length == 1) | .[0] | select(
              type == "object" and keys == ["inventory", "open_platforms", "run_id", "source_revision"] and
              (.run_id | type == "string" and test("^[1-9][0-9]*$")) and
              (.source_revision | type == "string" and test("^[a-f0-9]{40}$")) and
              (.open_platforms | type == "object" and length > 0) and
              (.inventory | type == "object" and length > 0))' <<< "$AUTHORIZATION"); then
            echo '::error::Missing or invalid attended review authorization record'
            exit 1
          fi
          printf '%s\n' "$record" > authorization.json
          run_id=$(jq -r .run_id <<< "$record")
          revision=$(jq -r .source_revision <<< "$record")
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq .id)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          if ! jq -e --arg rev "$revision" --arg workflow "$workflow_id" --arg repo "$GITHUB_REPOSITORY" '
            (.workflow_id | tostring) == $workflow and .repository.full_name == $repo and
            .head_repository.full_name == $repo and .event == "push" and .conclusion == "success" and .head_sha == $rev' \
            <<< "$run" >/dev/null; then
            echo '::error::Candidate must come from a successful release tag run, never from an exempt run'
            exit 1
          fi
          tag=$(jq -er '.head_branch | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$run")
          if ! attempt=$(jq -er '.run_attempt | select(. == 1)' <<< "$run"); then
            echo '::error::A rerun is not a reviewable release candidate; build under a new run ID'
            exit 1
          fi
          if ! tag_revision=$(bash trusted/scripts/release/verify-assets.sh --tag-revision "$tag") || [[ "$tag_revision" != "$revision" ]]; then
            echo '::error::Release tag no longer points to the authorized source revision'
            exit 1
          fi
          printf '%s\n' "run_id=$run_id" "attempt=$attempt" "tag=$tag" "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - name: Build the public trailer verifier
        working-directory: trusted
        run: cargo build --locked --release -p cerebellum-bridge-protocol --bin peer-trailer

      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ steps.run.outputs.attempt }}
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Compare the authorized inventory and verify packaged executable trailers
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.run.outputs.attempt }}
          RELEASE_COMMIT: ${{ steps.run.outputs.revision }}
          RELEASE_TAG: ${{ steps.run.outputs.tag }}
        shell: bash
        run: |
          manifest=candidate/candidate-manifest.json
          assets=candidate/assets
          verifier=trusted/target/release/peer-trailer
          checker=trusted/scripts/release/verify-assets.sh
          if ! jq -e --slurpfile auth authorization.json \
            --arg run_id "$RUN_ID" --arg attempt "$RUN_ATTEMPT" --arg rev "$RELEASE_COMMIT" --arg tag "$RELEASE_TAG" '
              .exempt == false and .run_id == $run_id and .run_attempt == $attempt and .source_revision == $rev and .tag == $tag and
              {run_id, source_revision, open_platforms, inventory} == $auth[0]' "$manifest" >/dev/null; then
            echo '::error::Candidate inventory or provenance does not match the attended review authorization'
            exit 1
          fi
          open=$(jq -ce .open_platforms "$manifest")
          release_manifest="$assets/release-manifest.json"
          release_host=$(jq -er '.binaries["ck-cerebellum-native-host"].reports | select(type == "string" and length > 0)' "$release_manifest")
          core_floor=$(jq -er '.requires_core | select(type == "string")' "$release_manifest")
          bash "$checker" --release-manifest "$RELEASE_COMMIT" "$release_host" "$core_floor" > expected-release-manifest.json
          bash "$checker" "$assets" expected-release-manifest.json "$open"
          actual=$(bash "$checker" --inventory "$assets")
          expected_executables=$(bash "$checker" --executables "$open")
          if ! jq -e --argjson actual "$actual" --argjson expected "$expected_executables" \
            '.inventory == $actual and .executables == $expected' "$manifest" >/dev/null; then
            echo '::error::Candidate hash or executable metadata differs from the authorized inventory'
            exit 1
          fi
          pin=$(sed -nE 's/^  BRIDGE_PEER_SIGNING_FINGERPRINT: "([0-9a-f]{64})"$/\1/p' trusted/.github/workflows/release.yml)
          if [[ ! "$pin" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Missing or invalid BRIDGE_PEER_SIGNING_FINGERPRINT in the trusted release workflow'
            exit 1
          fi
          key=$(jq -er '.public_key | select(type == "string" and test("^[A-Fa-f0-9]{64}$"))' "$manifest")
          CEREBELLUM_BRIDGE_PEER_PUBLIC_KEY="$key" BRIDGE_PEER_SIGNING_FINGERPRINT="$pin" \
            bash "$checker" --verify-trailers "$assets" "$open" "$verifier"

      - name: Stage the authorized bytes as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.run.outputs.revision }}
          RELEASE_TAG: ${{ steps.run.outputs.tag }}
        shell: bash
        run: |
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/.cortexkit/release-notes/$RELEASE_TAG.md" -f ref="$RELEASE_COMMIT" > release-notes.md
          test -s release-notes.md
          [[ $(bash trusted/scripts/release/verify-assets.sh --tag-revision "$RELEASE_TAG") == "$RELEASE_COMMIT" ]]
          gh release create "$RELEASE_TAG" candidate/assets/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md

      - name: Verify the uploaded draft bytes and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.run.outputs.revision }}
          RELEASE_TAG: ${{ steps.run.outputs.tag }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --dir draft-assets
          checker=trusted/scripts/release/verify-assets.sh
          open=$(jq -ce .open_platforms authorization.json)
          bash "$checker" draft-assets expected-release-manifest.json "$open"
          actual=$(bash "$checker" --inventory draft-assets)
          jq -e --argjson actual "$actual" '.inventory == $actual' authorization.json >/dev/null
          for asset in candidate/assets/*; do
            cmp "$asset" "draft-assets/${asset##*/}"
          done
          [[ $(bash "$checker" --tag-revision "$RELEASE_TAG") == "$RELEASE_COMMIT" ]]
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
